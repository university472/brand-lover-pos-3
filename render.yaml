# Render Blueprint — Brand Lover POS API (backend).
# Render dashboard → New → Blueprint → pick this repo. You will be asked for DATABASE_URL.
services:
  - type: web
    name: brand-lover-pos-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
      - key: TZ
        value: Asia/Karachi
      - key: DB_TIMEZONE
        value: "+05:00"
      # Aiven: Service → Overview → "Service URI" (mysql://avnadmin:...@...:port/defaultdb?ssl-mode=REQUIRED)
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Demo: shows demo logins on the login screen and fills a fresh database with sample data.
      - key: DEMO_MODE
        value: "true"
